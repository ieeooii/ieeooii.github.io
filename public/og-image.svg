<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="80%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#b3dfc0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f5f7f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="55%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#c8ecd4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f5f7f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="10%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#b3dfc0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f5f7f6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="logoClip">
      <rect x="920" y="80" width="200" height="200" rx="34"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f5f7f6"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>

  <!-- Name -->
  <text x="80" y="140" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" letter-spacing="-2" fill="#111111">WOOJIN LEE</text>

  <!-- Role -->
  <text x="82" y="196" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" letter-spacing="1" fill="#5dd98f">FRONTEND ENGINEER</text>

  <!-- Tagline -->
  <text x="82" y="280" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="400" fill="#111111">문제를 구조로 바꾸는 프론트엔드 엔지니어.</text>


  <!-- Kermit logo (rounded square, top right) -->
  <image href="kermit-full.png" x="920" y="80" width="200" height="200" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>

</svg>
